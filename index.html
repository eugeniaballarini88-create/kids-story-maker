<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little by Little</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --cream: #fdfaf5;
    --brown: #1a8a78;
    --dark: #0d4a3d;
    --accent: #e8a020;
    --soft: #3a8a7a;
    --border: #b0e0d8;
    --input-bg: #f5fdfb;
    --sub: #a07020;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--cream); min-height: 100vh; color: var(--dark); }

  #form-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .form-card { background: white; border-radius: 24px; padding: 2.5rem 2rem; width: 100%; max-width: 500px; box-shadow: 0 8px 40px rgba(26,138,120,0.10); border: 1px solid #b0e0d8; }
  .form-header { text-align: center; margin-bottom: 2rem; }
  .form-emoji { font-size: 3rem; display: block; margin-bottom: 0.5rem; }
  .form-title { font-family: 'Lora', serif; font-size: 1.8rem; color: var(--dark); margin-bottom: 0.4rem; }
  .form-subtitle { color: var(--sub); font-size: 0.85rem; line-height: 1.5; }
  .field { margin-bottom: 1.2rem; }
  label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--brown); margin-bottom: 0.4rem; }
  input, select, textarea { width: 100%; padding: 0.75rem 1rem; border: 2px solid var(--border); border-radius: 12px; font-family: 'Nunito', sans-serif; font-size: 0.95rem; color: var(--dark); background: var(--input-bg); transition: border-color 0.2s; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); background: white; }
  textarea { resize: none; height: 80px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .generate-btn { width: 100%; padding: 1rem; background: var(--accent); color: white; border: none; border-radius: 14px; font-family: 'Nunito', sans-serif; font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 4px 16px rgba(232,118,58,0.35); margin-top: 0.5rem; }
  .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,118,58,0.4); }
  .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .error-box { background: #fff0f0; border: 1px solid #ffcccc; border-radius: 12px; padding: 1rem; color: #c0392b; font-size: 0.9rem; margin-top: 1rem; display: none; line-height: 1.5; }
  .blocked-box { background: #f0faf8; border: 1px solid var(--border); border-radius: 12px; padding: 1rem; color: var(--dark); font-size: 0.9rem; margin-top: 1rem; display: none; line-height: 1.5; }

  .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: 1.2rem; border: 2px solid #ede5d8; border-radius: 12px; overflow: hidden; }
  .mode-btn { padding: 0.75rem 0.5rem; border: none; background: var(--cream); font-family: 'Nunito', sans-serif; font-size: 0.82rem; font-weight: 700; color: var(--soft); cursor: pointer; transition: all 0.2s; text-align: center; line-height: 1.3; }
  .mode-btn:first-child { border-right: 1px solid #ede5d8; }
  .mode-btn.active { background: var(--accent); color: white; }
  .mode-hint { font-size: 0.78rem; color: var(--soft); margin-top: -0.8rem; margin-bottom: 1.2rem; line-height: 1.4; padding: 0 0.2rem; }
  .field.dimmed label { color: #ccc; }
  .field.dimmed input { color: #bbb; border-color: #f0ebe3; background: #faf7f3; }

  #loading-screen { display: none; min-height: 100vh; align-items: center; justify-content: center; flex-direction: column; gap: 1.5rem; }
  .loading-book { font-size: 4rem; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .loading-text { font-family: 'Lora', serif; font-size: 1.3rem; color: var(--dark); }
  .loading-dots::after { content: ''; animation: dots 1.5s infinite; }
  @keyframes dots { 0%{content:''} 33%{content:'.'} 66%{content:'..'} 100%{content:'...'} }
  .progress-bar-wrap { width: 260px; height: 6px; background: #ede5d8; border-radius: 99px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width 0.5s ease; }
  .progress-label { font-size: 0.8rem; color: var(--soft); text-align: center; }

  #book-screen { display: none; background: #e8f5f2; min-height: 100vh; padding: 2rem 1rem 4rem; }
  .book-topbar { display: flex; justify-content: space-between; align-items: center; max-width: 640px; margin: 0 auto 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
  .back-btn { background: white; border: 2px solid var(--border); border-radius: 10px; padding: 0.5rem 1rem; font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--dark); cursor: pointer; transition: border-color 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .book-title-bar { font-family: 'Lora', serif; font-size: 1rem; color: var(--dark); font-style: italic; text-align: center; flex: 1; }

  .book-pages { max-width: 640px; margin: 0 auto; }
  .book-page { background: white; border-radius: 4px; box-shadow: 0 4px 24px rgba(26,138,120,0.12), 2px 2px 0 #b0e0d8; margin-bottom: 2rem; overflow: hidden; display: flex; flex-direction: column; }

  .cover-img-wrap { display: none; height: 340px; overflow: hidden; }
  .cover-img-wrap.has-image { display: block; }
  .cover-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-img-placeholder { display: flex; align-items: center; justify-content: center; height: 240px; background: linear-gradient(135deg, #fde8c8 0%, #fbc4a0 50%, #c8e6f5 100%); }
  .cover-text-band { background: linear-gradient(135deg, #e8f5f2 0%, #b0e0d8 50%, #fdf5e0 100%); padding: 2.5rem 2rem; text-align: center; }
  .cover-book-title { font-family: 'Lora', serif; font-size: 1.8rem; color: #0d4a3d; line-height: 1.3; margin-bottom: 0.4rem; }
  .cover-book-sub { color: var(--sub); font-size: 0.85rem; }

  .story-img-wrap { display: none; height: 260px; overflow: hidden; }
  .story-img-wrap.has-image { display: block; }
  .story-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .story-text-band { padding: 2rem 2.5rem; display: flex; flex-direction: column; justify-content: center; border-left: 4px solid #1a8a78; }
  .story-page-num { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: #3a8a7a; margin-bottom: 0.8rem; }
  .story-page-text { font-family: 'Lora', serif; font-size: 1.15rem; line-height: 1.9; color: var(--dark); }

  .end-page { background: linear-gradient(135deg, #1a8a78, #0d4a3d); padding: 3rem 2rem; text-align: center; }
  .end-page h2 { font-family: 'Lora', serif; font-size: 2.2rem; color: white; margin-bottom: 0.4rem; }
  .end-page p { color: rgba(255,255,255,0.8); font-size: 0.9rem; }

  .new-story-btn { display: block; width: 100%; max-width: 300px; margin: 0 auto; padding: 1rem; background: #0d4a3d; color: white; border: none; border-radius: 14px; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800; cursor: pointer; text-align: center; }
  .new-story-btn:hover { opacity: 0.85; }
  .book-actions { display: flex; gap: 0.4rem; }
  .save-btn { background: white; border: 2px solid var(--border); border-radius: 10px; padding: 0.5rem 0.8rem; font-family: 'Nunito', sans-serif; font-size: 0.82rem; font-weight: 700; color: var(--dark); cursor: pointer; transition: all 0.2s; }
  .save-btn:hover { border-color: var(--accent); color: var(--accent); }
  .save-btn.saved { border-color: #27ae60; color: #27ae60; background: #f0fff4; }
  .saved-section { width: 100%; max-width: 500px; margin-top: 1.5rem; }
  .saved-section h3 { font-family: 'Lora', serif; font-size: 1rem; color: var(--brown); margin-bottom: 0.8rem; }
  .saved-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .saved-item { background: white; border: 2px solid #ede5d8; border-radius: 12px; padding: 0.8rem 1rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: border-color 0.2s; }
  .saved-item:hover { border-color: var(--brown); }
  .saved-item-title { font-family: 'Lora', serif; font-size: 0.95rem; color: var(--dark); font-style: italic; }
  .saved-item-meta { font-size: 0.75rem; color: var(--soft); margin-top: 0.2rem; }
  .saved-item-delete { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; padding: 0.2rem 0.5rem; border-radius: 6px; }
  .saved-item-delete:hover { color: #e74c3c; background: #fff0f0; }

  @media (max-width: 520px) {
    .cover-img-wrap { height: 240px; }
    .story-img-wrap { height: 180px; }
  }
</style>
</head>
<body>

<!-- FORM -->
<div id="form-screen">
  <div class="form-card">
    <div class="form-header">
      <span class="form-emoji">🌟</span>
      <h1 class="form-title">Little by Little</h1>
      <p class="form-subtitle">One story at a time</p>
    </div>

    <div class="field">
      <label>Story Style</label>
      <div class="mode-toggle">
        <button type="button" class="mode-btn active" id="mode-personal" onclick="setMode('personal')">🧒 My child is the hero<br><span style="font-weight:400;font-size:0.75rem;">Uses your child's name</span></button>
        <button type="button" class="mode-btn" id="mode-fictional" onclick="setMode('fictional')">🐻 A fictional character<br><span style="font-weight:400;font-size:0.75rem;">Animal or fantasy hero</span></button>
      </div>
      <p class="mode-hint" id="mode-hint">The story will feature your child as the main character.</p>
    </div>

    <div class="row">
      <div class="field" id="name-field">
        <label>Child's Name</label>
        <input type="text" id="child-name" placeholder="e.g. Sofia, Leo, Mia..." />
      </div>
      <div class="field">
        <label>Age</label>
        <select id="age">
          <option value="0-1">0–1 year</option>
          <option value="2-3">2–3 years</option>
          <option value="4-5" selected>4–5 years</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Gender</label>
      <select id="gender">
        <option value="girl">Girl</option>
        <option value="boy">Boy</option>
        <option value="neutral">No preference</option>
      </select>
    </div>

    <div class="field">
      <label>Story Topic / Theme</label>
      <textarea id="topic" placeholder="e.g. She's nervous about starting nursery next week — worried no one will want to play with her, but she loves dinosaurs and hopes to find a friend who does too."></textarea>
      <p style="font-size:0.78rem;color:var(--soft);margin-top:0.4rem;line-height:1.5;">💡 The more specific you are, the more personalised the story.</p>
    </div>

    <div class="field">
      <label>Moral or Lesson <span style="font-weight:400;text-transform:none;letter-spacing:0;">(optional)</span></label>
      <input type="text" id="moral" placeholder="e.g. change can be exciting, it's okay to feel scared" />
    </div>

    <div class="field">
      <label>Story Length</label>
      <select id="pages">
        <option value="6">6 pages — Quick bedtime story</option>
        <option value="8" selected>8 pages — Classic storybook</option>
        <option value="10">10 pages — Full adventure</option>
      </select>
    </div>

    <button class="generate-btn" onclick="generateStory()">✨ Create My Story</button>
    <div class="error-box" id="error-box"></div>
    <div class="blocked-box" id="blocked-box"></div>
  </div>

  <div class="saved-section" id="saved-section" style="display:none;">
    <h3>📚 Your Saved Stories</h3>
    <div class="saved-list" id="saved-list"></div>
  </div>
</div>

<!-- LOADING -->
<div id="loading-screen">
  <div class="loading-book">📖</div>
  <div class="loading-text">Creating your story<span class="loading-dots"></span></div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="progress-label" id="progress-label">Checking your topic...</div>
</div>

<!-- BOOK -->
<div id="book-screen">
  <div class="book-topbar">
    <button class="back-btn" onclick="goBack()">← New Story</button>
    <div class="book-title-bar" id="book-title-bar"></div>
    <div class="book-actions">
      <button class="save-btn" id="save-btn" onclick="saveStory()">🔖 Save</button>
      <button class="save-btn" id="download-btn" onclick="downloadPDF()">⬇️ Download PDF</button>
    </div>
  </div>

  <div class="book-pages" id="page-container"></div>
  <button class="new-story-btn" onclick="goBack()" style="margin-top:1rem;">✨ Create Another Story</button>
</div>

<script>
  var storyMode = 'personal';
  var currentStory = null;
  var currentName = '';

  function show(id) {
    var screens = ['form-screen', 'loading-screen', 'book-screen'];
    screens.forEach(function(screenId) {
      var el = document.getElementById(screenId);
      if (!el) return;
      el.style.display = screenId === id ? (screenId === 'book-screen' ? 'block' : 'flex') : 'none';
    });
  }

  function setProgress(pct, label) {
    var bar = document.getElementById('progress-bar');
    var lbl = document.getElementById('progress-label');
    if (bar) bar.style.width = pct + '%';
    if (lbl) lbl.textContent = label;
  }

  function showError(msg) {
    var errBox = document.getElementById('error-box');
    var blkBox = document.getElementById('blocked-box');
    if (errBox) { errBox.textContent = msg; errBox.style.display = 'block'; }
    if (blkBox) blkBox.style.display = 'none';
  }

  function showBlocked(msg) {
    var errBox = document.getElementById('error-box');
    var blkBox = document.getElementById('blocked-box');
    if (blkBox) { blkBox.innerHTML = '🌟 ' + msg; blkBox.style.display = 'block'; }
    if (errBox) errBox.style.display = 'none';
  }

  function setMode(mode) {
    storyMode = mode;
    var nameField    = document.getElementById('name-field');
    var hint         = document.getElementById('mode-hint');
    var personalBtn  = document.getElementById('mode-personal');
    var fictionalBtn = document.getElementById('mode-fictional');
    var nameInput    = document.getElementById('child-name');
    if (!nameField || !hint || !personalBtn || !fictionalBtn || !nameInput) return;
    if (mode === 'personal') {
      personalBtn.classList.add('active');
      fictionalBtn.classList.remove('active');
      nameField.classList.remove('dimmed');
      nameInput.placeholder = 'e.g. Sofia';
      hint.textContent = 'The story will feature your child as the main character.';
    } else {
      fictionalBtn.classList.add('active');
      personalBtn.classList.remove('active');
      nameField.classList.add('dimmed');
      nameInput.placeholder = 'Optional — not used in story';
      hint.textContent = "We'll invent a warm animal or fantasy character.";
    }
  }

  async function generateStory() {
    var nameEl   = document.getElementById('child-name');
    var ageEl    = document.getElementById('age');
    var genderEl = document.getElementById('gender');
    var topicEl  = document.getElementById('topic');
    var moralEl  = document.getElementById('moral');
    var pagesEl  = document.getElementById('pages');
    var btn      = document.querySelector('.generate-btn');
    if (!nameEl || !ageEl || !genderEl || !topicEl || !moralEl || !pagesEl || !btn) return;

    var name   = nameEl.value.trim() || 'your little one';
    var age    = ageEl.value;
    var gender = genderEl.value;
    var topic  = topicEl.value.trim();
    var moral  = moralEl.value.trim();
    var pages  = pagesEl.value;

    document.getElementById('error-box').style.display = 'none';
    document.getElementById('blocked-box').style.display = 'none';

    if (!topic) { showError('Please enter a story topic or theme before continuing.'); return; }

    btn.disabled = true;
    show('loading-screen');
    setProgress(10, 'Getting ready...');

    try {
      setProgress(30, 'Once upon a time...');
      var res = await fetch('/api/story', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, age: age, gender: gender, topic: topic, moral: moral, pages: pages, mode: storyMode })
      });

      if (!res.ok) {
        var errData = {};
        try { errData = await res.json(); } catch(e) {}
        throw new Error(errData.error || 'Server error ' + res.status);
      }

      var data = await res.json();

      if (data.blocked) {
        show('form-screen');
        btn.disabled = false;
        showBlocked(data.reason || 'This topic could not be used for a story.');
        return;
      }

      if (!data.title || !Array.isArray(data.pages) || data.pages.length === 0) {
        throw new Error('Incomplete story received. Please try again.');
      }

      setProgress(80, 'Turning the pages...');
      currentStory = data;
      currentName  = name;

      var saveBtn = document.getElementById('save-btn');
      if (saveBtn) { saveBtn.textContent = '🔖 Save'; saveBtn.classList.remove('saved'); }

      renderBook(data, name);
      setProgress(100, 'Your story is ready ✨');
      await new Promise(function(r) { setTimeout(r, 400); });
      show('book-screen');
      window.scrollTo(0, 0);

    } catch(err) {
      show('form-screen');
      btn.disabled = false;
      showError('Something went wrong. Please try again.');
      console.error(err);
    }
  }

  function safeText(str) {
    var d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function makeImageEl(src, alt) {
    if (!src || typeof src !== 'string') return null;
    if (!src.startsWith('data:image/')) return null;
    var img = document.createElement('img');
    img.src = src;
    img.alt = alt || '';
    return img;
  }

  function renderBook(story, name) {
    var container = document.getElementById('page-container');
    var titleBar  = document.getElementById('book-title-bar');
    if (!container || !titleBar) return;

    container.innerHTML = '';
    titleBar.textContent = story.title || '';

    // COVER
    var cover = document.createElement('div');
    cover.className = 'book-page';

    var coverImgWrap = document.createElement('div');
    coverImgWrap.className = 'cover-img-wrap';
    var coverImg = makeImageEl(story.coverImage, story.title + ' cover');
    if (coverImg) {
      coverImgWrap.classList.add('has-image');
      coverImgWrap.appendChild(coverImg);
    } else {
      var placeholder = document.createElement('div');
      placeholder.className = 'cover-img-placeholder';
      placeholder.innerHTML = '<span style="font-size:4rem;">📖</span>';
      coverImgWrap.appendChild(placeholder);
      coverImgWrap.style.display = 'block';
      coverImgWrap.style.height = '240px';
    }

    var coverBand = document.createElement('div');
    coverBand.className = 'cover-text-band';
    coverBand.innerHTML =
      '<div class="cover-book-title">' + safeText(story.title) + '</div>' +
      '<div class="cover-book-sub">A story for ' + safeText(name) + ' ✨</div>';

    cover.appendChild(coverImgWrap);
    cover.appendChild(coverBand);
    container.appendChild(cover);

    // STORY PAGES
    story.pages.forEach(function(page, i) {
      if (!page || typeof page.text !== 'string') return;

      var pageEl = document.createElement('div');
      pageEl.className = 'book-page';

      var imgWrap = document.createElement('div');
      imgWrap.className = 'story-img-wrap';
      var pageImg = makeImageEl(page.image, 'Page ' + (i + 1));
      if (pageImg) {
        imgWrap.classList.add('has-image');
        imgWrap.appendChild(pageImg);
        pageEl.appendChild(imgWrap);
      }

      var textBand = document.createElement('div');
      textBand.className = 'story-text-band';
      textBand.innerHTML =
        '<div class="story-page-num">Page ' + (i + 1) + '</div>' +
        '<div class="story-page-text">' + safeText(page.text) + '</div>';

      pageEl.appendChild(textBand);
      container.appendChild(pageEl);
    });

    // END PAGE
    var end = document.createElement('div');
    end.className = 'book-page end-page';
    end.innerHTML = '<h2>The End 🌟</h2><p>A story made with love for ' + safeText(name) + '</p>';
    container.appendChild(end);
  }

  // ── PDF DOWNLOAD (with images) ────────────────────────────────────────
  function downloadPDF() {
    if (!currentStory) return;
    var win = window.open('', '_blank');
    if (!win) return;

    var story = currentStory;
    var childName = currentName;

    var coverImgHtml = '';
    if (story.coverImage && story.coverImage.startsWith('data:image/')) {
      coverImgHtml = '<img src="' + story.coverImage + '" class="cover-img" alt="cover">';
    }

    var pagesHtml = '';
    story.pages.forEach(function(page, i) {
      if (!page || typeof page.text !== 'string') return;
      var imgHtml = '';
      if (page.image && page.image.startsWith('data:image/')) {
        imgHtml = '<img src="' + page.image + '" class="page-img" alt="Page ' + (i + 1) + '">';
      }
      pagesHtml +=
        '<div class="pg">' +
          imgHtml +
          '<div class="pg-text">' +
            '<div class="pgn">Page ' + (i + 1) + '</div>' +
            '<div class="pgt">' + safeText(page.text) + '</div>' +
          '</div>' +
        '</div>';
    });

    var css = [
      '* { box-sizing: border-box; margin: 0; padding: 0; }',
      'body { font-family: Georgia, serif; background: white; color: #0d4a3d; }',
      '.wrap { max-width: 620px; margin: 0 auto; padding: 2rem; }',
      '.brand { text-align: center; margin-bottom: 2rem; color: #3a8a7a; font-size: 0.8rem; font-weight: bold; letter-spacing: 0.1em; font-family: sans-serif; }',
      '.cover { background: linear-gradient(135deg, #e8f5f2, #b0e0d8, #fdf5e0); text-align: center; margin-bottom: 2rem; border-radius: 8px; overflow: hidden; }',
      '.cover-img { width: 100%; max-height: 340px; object-fit: cover; display: block; }',
      '.cover-text { padding: 2rem; }',
      '.ct { font-size: 1.8rem; font-weight: 600; color: #0d4a3d; line-height: 1.3; margin-bottom: 0.5rem; }',
      '.cs { color: #a07020; font-size: 0.9rem; font-family: sans-serif; }',
      '.pg { margin-bottom: 1.8rem; border-radius: 8px; overflow: hidden; border: 1px solid #e0f0ee; page-break-inside: avoid; }',
      '.page-img { width: 100%; max-height: 280px; object-fit: cover; display: block; }',
      '.pg-text { padding: 1.2rem 1.5rem; border-left: 4px solid #1a8a78; }',
      '.pgn { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: #3a8a7a; margin-bottom: 0.4rem; font-family: sans-serif; }',
      '.pgt { font-size: 1rem; line-height: 1.8; color: #0d4a3d; }',
      '.end { background: linear-gradient(135deg, #1a8a78, #0d4a3d); padding: 2rem; text-align: center; border-radius: 8px; margin-top: 1.5rem; }',
      '.end h2 { color: white; font-size: 1.3rem; margin-bottom: 0.3rem; }',
      '.end p { color: rgba(255,255,255,0.8); font-size: 0.82rem; font-family: sans-serif; }',
      '@media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }'
    ].join('\n');

    var html = '<!DOCTYPE html><html><head><meta charset="UTF-8">'
      + '<title>' + safeText(story.title) + '</title>'
      + '<style>' + css + '</style></head><body><div class="wrap">'
      + '<div class="brand">LITTLE BY LITTLE</div>'
      + '<div class="cover">'
      + coverImgHtml
      + '<div class="cover-text"><div class="ct">' + safeText(story.title) + '</div>'
      + '<div class="cs">A story for ' + safeText(childName) + '</div></div>'
      + '</div>'
      + pagesHtml
      + '<div class="end"><h2>The End</h2><p>A story made with love for ' + safeText(childName) + '</p></div>'
      + '</div></body></html>';

    win.document.write(html);
    win.document.close();
    setTimeout(function() { win.print(); }, 800);
  }

  // ── SAVE / LOAD ───────────────────────────────────────────────────────
  function saveStory() {
    if (!currentStory) return;
    var btn = document.getElementById('save-btn');

    var list = [];
    try { list = JSON.parse(localStorage.getItem('savedStories') || '[]'); } catch(e) { list = []; }
    if (!Array.isArray(list)) list = [];

    list.unshift({
      key:   Date.now().toString(),
      title: currentStory.title || 'Untitled',
      name:  currentName,
      date:  new Date().toLocaleDateString(),
      story: currentStory
    });

    try { localStorage.setItem('savedStories', JSON.stringify(list)); } catch(e) {}

    if (btn) {
      btn.textContent = '✅ Saved!';
      btn.classList.add('saved');
      setTimeout(function() { btn.textContent = '🔖 Save'; btn.classList.remove('saved'); }, 2000);
    }
    renderSavedList();
  }

  function renderSavedList() {
    var section = document.getElementById('saved-section');
    var el      = document.getElementById('saved-list');
    if (!section || !el) return;

    var list = [];
    try { list = JSON.parse(localStorage.getItem('savedStories') || '[]'); } catch(e) { list = []; }
    if (!Array.isArray(list) || list.length === 0) { section.style.display = 'none'; return; }

    section.style.display = 'block';
    el.innerHTML = '';

    list.forEach(function(entry) {
      if (!entry || !entry.key) return;
      var item = document.createElement('div');
      item.className = 'saved-item';

      var info = document.createElement('div');
      info.style.flex = '1';
      info.innerHTML =
        '<div class="saved-item-title">' + safeText(entry.title) + '</div>' +
        '<div class="saved-item-meta">For ' + safeText(entry.name) + ' · ' + safeText(entry.date) + '</div>';
      info.addEventListener('click', function() { loadStory(entry); });

      var del = document.createElement('button');
      del.className = 'saved-item-delete';
      del.textContent = '✕';
      del.addEventListener('click', function() { deleteStory(entry.key); });

      item.appendChild(info);
      item.appendChild(del);
      el.appendChild(item);
    });
  }

  function loadStory(entry) {
    if (!entry || !entry.story) return;
    currentStory = entry.story;
    currentName  = entry.name || '';
    renderBook(entry.story, currentName);
    var titleBar = document.getElementById('book-title-bar');
    if (titleBar) titleBar.textContent = entry.story.title || '';
    var saveBtn = document.getElementById('save-btn');
    if (saveBtn) saveBtn.textContent = '🔖 Save';
    show('book-screen');
    window.scrollTo(0, 0);
  }

  function deleteStory(key) {
    var list = [];
    try { list = JSON.parse(localStorage.getItem('savedStories') || '[]'); } catch(e) { list = []; }
    if (!Array.isArray(list)) list = [];
    list = list.filter(function(s) { return s && s.key !== key; });
    try { localStorage.setItem('savedStories', JSON.stringify(list)); } catch(e) {}
    renderSavedList();
  }

  function goBack() {
    show('form-screen');
    var btn = document.querySelector('.generate-btn');
    if (btn) btn.disabled = false;
    window.scrollTo(0, 0);
    renderSavedList();
  }

  renderSavedList();
</script>
</body>
</html>
